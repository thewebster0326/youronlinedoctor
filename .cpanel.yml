---
deployment:
  tasks:
    # youronlinedoctor.co.za is the account's PRIMARY domain, so public_html is
    # its document root. For an addon domain, point DEPLOYPATH at that domain's
    # own docroot instead.
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH/assets $DEPLOYPATH/static
    - /bin/cp -f *.html $DEPLOYPATH
    - /bin/cp -f robots.txt sitemap.xml $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
    - /bin/cp -Rf assets/. $DEPLOYPATH/assets/
    - /bin/cp -Rf static/. $DEPLOYPATH/static/
