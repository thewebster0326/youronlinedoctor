---
deployment:
  tasks:
    # If youronlinedoctor.co.za is an ADDON domain on this cPanel account,
    # change the line below to its own docroot, e.g.
    #   export DEPLOYPATH=$HOME/youronlinedoctor.co.za/
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH/assets
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp styles.css $DEPLOYPATH
    - /bin/cp robots.txt $DEPLOYPATH
    - /bin/cp -R assets/. $DEPLOYPATH/assets/
